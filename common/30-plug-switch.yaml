substitutions:
  button_pin: REPLACEME
  button_inverted: true
  relay_pin: REPLACEME

# ---

binary_sensor:
  - platform: gpio
    id: binary_switch_1
    pin:
      number: ${button_pin}
      inverted: ${button_inverted}
      mode: INPUT_PULLUP
    on_press:
      then:
        - switch.toggle: switch_1

switch:
  - platform: gpio
    id: switch_1
    name: Switch
    pin: ${relay_pin}
    icon: mdi:power-plug-outline
