packages:
  base: !include common/00-base.yaml
  lt-version: !include common/02-lt-version.yaml
  wifi-fast: !include common/03-wifi-fast.yaml
substitutions:
  device_name: livingroom-light
  friendly_name: Living Room Light
  api_key: !secret livingroom_light_api
  ota_password: !secret livingroom_light_ota
  static_ip: 192.168.0.211

# ---

rtl87xx:
  board: wr3
  framework:
    version: latest

esphome:
  platformio_options:
    custom_versions.freertos: 8.2.3

external_components:
  source: components
  components:
    - remote_gpio
  refresh: 10 min

# ---

# status_led:
#   pin:
#     number: PA23

uart:
  id: remote_uart
  baud_rate: 2000
  tx_pin: PA29

remote_gpio:
  - id: remote_hub
    uart_id: remote_uart

output:
  - platform: gpio
    id: gpio_backlight
    pin: PA23
    inverted: true
  - platform: libretiny_pwm
    id: gpio_led_1
    pin: PA0
  - platform: libretiny_pwm
    id: gpio_led_2
    pin: PA14
  - platform: libretiny_pwm
    id: gpio_led_3
    pin: PA5
  - platform: libretiny_pwm
    id: gpio_led_4
    pin: PA12
  - platform: gpio
    id: gpio_relay_1 # Light 1 (top left) -> Channel 0 (top left)
    pin:
      remote_gpio: remote_hub
      number: 0
  - platform: gpio
    id: gpio_relay_2 # Light 2 (top right) -> Channel 1 (top right)
    pin:
      remote_gpio: remote_hub
      number: 1
  - platform: gpio
    id: gpio_relay_3 # Light 3 (bottom left) -> Channel 4 (center)
    pin:
      remote_gpio: remote_hub
      number: 4
  - platform: gpio
    id: gpio_relay_4 # Light 4 (bottom right) -> Channel 3 (bottom right)
    pin:
      remote_gpio: remote_hub
      number: 3
  - platform: gpio
    id: gpio_relay_5 # Light 5 (double click) -> Channel 2 (bottom left)
    pin:
      remote_gpio: remote_hub
      number: 2

light:
  - platform: binary
    id: light_backlight
    name: Backlight
    output: gpio_backlight
    restore_mode: ALWAYS_ON
    entity_category: config

  - platform: monochromatic
    id: light_led_1
    output: gpio_led_1
    default_transition_length: 0.3s
  - platform: monochromatic
    id: light_led_2
    output: gpio_led_2
    default_transition_length: 0.3s
  - platform: monochromatic
    id: light_led_3
    output: gpio_led_3
    default_transition_length: 0.3s
  - platform: monochromatic
    id: light_led_4
    output: gpio_led_4
    default_transition_length: 0.3s

  - platform: binary
    id: light_1
    name: Light 1
    output: gpio_relay_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: light_led_1
          brightness: 100%
    on_turn_off:
      - light.turn_on:
          id: light_led_1
          brightness: 0%

  - platform: binary
    id: light_2
    name: Light 2
    output: gpio_relay_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: light_led_2
          brightness: 100%
    on_turn_off:
      - light.turn_on:
          id: light_led_2
          brightness: 0%

  - platform: binary
    id: light_3
    name: Light 3
    output: gpio_relay_3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: light_led_3
          brightness: 100%
    on_turn_off:
      - light.turn_on:
          id: light_led_3
          brightness: 0%

  - platform: binary
    id: light_4
    name: Light 4
    output: gpio_relay_4
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: light_led_4
          brightness: 100%
    on_turn_off:
      - light.turn_on:
          id: light_led_4
          brightness: 0%

  - platform: binary
    id: light_5
    name: Light 5
    output: gpio_relay_5
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: button_1
    pin:
      number: PA15
      inverted: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 210ms
        then:
          - light.toggle: light_1
      - timing:
          - ON for at least 50ms
          - OFF for at most 200ms
          - ON for at least 20ms
        then:
          - if:
              condition:
                and:
                  - light.is_off: light_1
                  - light.is_off: light_2
                  - light.is_off: light_3
                  - light.is_off: light_4
                  - light.is_off: light_5
              then:
                - light.turn_on: light_1
                - light.turn_on: light_2
                - light.turn_on: light_3
                - light.turn_on: light_4
                - light.turn_on: light_5
              else:
                - light.turn_off: light_1
                - light.turn_off: light_2
                - light.turn_off: light_3
                - light.turn_off: light_4
                - light.turn_off: light_5

  - platform: gpio
    id: button_2
    pin:
      number: PA19
      inverted: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 210ms
        then:
          - light.toggle: light_2
      - timing:
          - ON for at least 50ms
          - OFF for at most 200ms
          - ON for at least 20ms
        then:
          - if:
              condition:
                and:
                  - light.is_on: light_1
                  - light.is_on: light_2
              then:
                - light.turn_off: light_1
                - light.turn_off: light_2
              else:
                - light.turn_on: light_1
                - light.turn_on: light_2
                - light.turn_off: light_3
                - light.turn_off: light_4

  - platform: gpio
    id: button_3
    pin:
      number: PA18
      inverted: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 210ms
        then:
          - light.toggle: light_3
      - timing:
          - ON for at least 50ms
          - OFF for at most 200ms
          - ON for at least 20ms
        then:
          - light.toggle: light_5

  - platform: gpio
    id: button_4
    pin:
      number: PA22
      inverted: true
    on_multi_click:
      - timing:
          - ON for at least 50ms
          - OFF for at least 210ms
        then:
          - light.toggle: light_4
      - timing:
          - ON for at least 50ms
          - OFF for at most 200ms
          - ON for at least 20ms
        then:
          - if:
              condition:
                and:
                  - light.is_on: light_3
                  - light.is_on: light_4
              then:
                - light.turn_off: light_3
                - light.turn_off: light_4
              else:
                - light.turn_off: light_1
                - light.turn_off: light_2
                - light.turn_on: light_3
                - light.turn_on: light_4
