  lt-version: !include common/02-lt-version.yaml
  wifi-fast: !include common/03-wifi-fast.yaml
  status-led: !include common/10-status-led.yaml
  plug-switch: !include common/30-plug-switch.yaml
  energy-bl0937: !include common/40-energy-bl0937.yaml
substitutions:
  device_name: smart-plug-5
  friendly_name: Smart Plug 5
  api_key: !secret smart_plug_5_api
  ota_password: !secret smart_plug_5_ota
