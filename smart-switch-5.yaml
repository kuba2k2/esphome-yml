packages:
  base: !include common/00-base.yaml
  status-led: !include common/10-status-led.yaml
substitutions:
  device_name: smart-switch-5
  friendly_name: Smart Switch 5
  api_key: !secret smart_switch_5_api
  ota_password: !secret smart_switch_5_ota
  status_pin: GPIO13

# ---

esp8266:
  board: esp01_1m
  restore_from_flash: true

# ---

binary_sensor:
  - platform: gpio
    id: binary_switch_1
    pin:
      number: GPIO4
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      then:
        - switch.toggle: switch_1

switch:
  - platform: gpio
    id: switch_1
    name: Relay 1
    pin: GPIO5
    on_turn_on:
      - light.turn_on: light_status
    on_turn_off:
      - light.turn_off: light_status
